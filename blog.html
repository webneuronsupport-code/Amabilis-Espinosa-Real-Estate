<!DOCTYPE html>
<html lang="es-MX" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/i18n.js?v=170"></script>
  <title>Blog inmobiliario y reels | Noticias, guías y recorridos | Amábilis &amp; Espinosa</title>
  <meta name="description" content="Noticias del mercado inmobiliario, guías para comprar y vender, y reels con recorridos por nuestras propiedades en Metepec, Toluca y CDMX.">
  <link rel="canonical" href="https://www.amabilisespinosa.com/blog">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blog inmobiliario y reels | Noticias, guías y recorridos | Amábilis &amp; Espinosa">
  <meta property="og:description" content="Noticias del mercado inmobiliario, guías para comprar y vender, y reels con recorridos por nuestras propiedades en Metepec, Toluca y CDMX.">
  <meta name="theme-color" content="#0a1430">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta property="og:image" content="https://www.amabilisespinosa.com/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Google Tag Manager (ID en js/gtm.js) -->
  <script src="js/gtm.js?v=170" data-page="blog"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=170">
  <link rel="stylesheet" href="css/mobile.css?v=170">
</head>
<body data-page="blog">
  <main>
    <!-- Los reels mandan, pero enmarcados como el resto del sitio -->
    <section class="reels" id="reels">
      <div class="reels__fondo" aria-hidden="true"></div>
      <div class="reels__trama" aria-hidden="true"></div>

      <div class="container reels__intro">
        <nav class="breadcrumbs breadcrumbs--claro" data-fade><a href="index.html">Inicio</a>/<span>Blog</span></nav>
        <div class="reels__encabezado">
          <div>
            <span class="eyebrow eyebrow--oro" data-fade>En video</span>
            <h1 class="reels__titulo" data-split>Blog <em>&amp;</em> Reels</h1>
          </div>
          <p class="reels__lead" data-fade>Recorridos de un minuto por dentro de las casas,
            y debajo las noticias y guías para decidir con calma.</p>
        </div>
      </div>

      <div class="reels__escenario" id="reelsEscenario">
        <!-- Columna izquierda: ficha del reel centrado, cambia al navegar -->
        <aside class="reels__ficha" id="reelsFicha" aria-live="polite">
          <span class="reels__indice"><b id="reelsNum">01</b><i>/</i><span id="reelsTotal">02</span></span>
          <h2 class="reels__fichaTitulo" id="reelsFichaTitulo"></h2>
          <p class="reels__fichaTexto" id="reelsFichaTexto"></p>
          <a class="btn btn--gold btn--sm reels__fichaCta" id="reelsCta" href="#" data-loc="reel-ficha">
            <span class="btn__label"><span>Ver el reel</span><span>Ver el reel</span></span>
          </a>
        </aside>

        <div class="reels__pista" id="reelsPista" role="group" aria-label="Carrusel de reels"></div>

        <!-- Columna derecha: controles -->
        <div class="reels__mandos">
          <button class="reels__flecha reels__flecha--prev" type="button" aria-label="Anterior"></button>
          <button class="reels__flecha reels__flecha--next" type="button" aria-label="Siguiente"></button>
          <span class="reels__pista-texto">Arrastra</span>
        </div>
      </div>

      <div class="reels__pie">
        <div class="reels__puntos" id="reelsPuntos" role="tablist" aria-label="Ir a un reel"></div>
        <a class="reels__abajo" href="#articulos" aria-label="Ir a los artículos">
          <span>Noticias y guías</span>
        </a>
      </div>
    </section>

    <!-- Artículos: aquí sí conviene el formato de lectura -->
    <section class="section articulos" id="articulos">
      <div class="container">
        <div class="articulos__cabecera">
          <div>
            <span class="eyebrow">Para leer</span>
            <h2 class="articulos__titulo">Noticias y guías</h2>
          </div>
          <div class="chips" id="b-cat" role="group" aria-label="Categoría">
            <button class="chip" data-value="">Todo</button>
            <button class="chip" data-value="Noticias">Noticias</button>
            <button class="chip" data-value="Guías">Guías</button>
          </div>
        </div>
        <div class="blog-grid blog-grid--feature" id="blogGrid"></div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/data.js?v=170"></script>
  <script src="js/supabase-config.js?v=170"></script>
  <script src="js/store.js?v=170"></script>
</body>
</html>
